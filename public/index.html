<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Luna</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='26' font-size='26'%3E🌙%3C/text%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#ffe7cf;--pn:#fff6ee;--bd:#e3c3a6;--tx:#3b2a20;--mu:#8a7060;--dot:#a58468;--ln:#7a4e2a1f}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background-color:var(--bg);color:var(--tx);font:15px/1.8 "Zen Kaku Gothic New",system-ui,sans-serif;overflow:hidden}
button,select,textarea,input{font:inherit;color:inherit}button{cursor:pointer;background:none;border:0;display:inline-flex;align-items:center;gap:6px}
svg.lucide{width:18px;height:18px;stroke-width:1.8;flex:none}
#app{display:flex;height:100%}
aside{width:260px;flex:none;display:flex;flex-direction:column;gap:10px;padding:16px 12px;background:#ffe7cfee;border-right:1px solid var(--ln);z-index:5;transition:transform .3s}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:20px;letter-spacing:.06em;padding:2px 8px}
#new,#cfg{justify-content:center;padding:10px;border-radius:12px;border:1px solid var(--bd);background:var(--pn);transition:.2s}
#new:hover,#cfg:hover{border-color:var(--dot)}
#list{flex:1;overflow:auto;display:flex;flex-direction:column;gap:2px}
.ci{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:8px 10px;border-radius:10px;cursor:pointer;color:var(--mu);font-size:13.5px;line-height:1.5}
.ci:hover{background:#ffffff80}.ci.on{background:var(--pn);color:var(--tx)}
.ci span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ci button{opacity:0;color:var(--mu)}.ci:hover button{opacity:1}
main{flex:1;min-width:0;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:8px;padding:12px 18px}
#menu{display:none}#sx{display:none;margin-left:auto;color:var(--mu)}
#model{background:var(--pn);border:1px solid var(--bd);border-radius:999px;padding:7px 14px;max-width:100%;outline:0}
#model option{background:#fff3e8}
#scroll{flex:1;overflow:auto;padding:10px 18px 30px}
#empty{max-width:760px;margin:12vh auto 0;text-align:center}
#empty h1{font-size:26px;font-weight:700;margin:0 0 4px}#empty p{color:var(--mu);margin:0 0 22px}
.chips{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.chips button{padding:10px 16px;border-radius:14px;border:1px solid var(--bd);background:var(--pn);transition:.2s}
.chips button:hover{border-color:var(--dot);transform:translateY(-2px)}
.m{display:flex;gap:12px;margin:22px auto;max-width:760px;animation:up .4s both}
@keyframes up{from{opacity:0;transform:translateY(8px)}}
.m.user{justify-content:flex-end}
.u{background:var(--pn);border:1px solid var(--bd);padding:9px 16px;border-radius:22px 22px 6px 22px;max-width:85%;overflow-wrap:anywhere}
.av{flex:none;width:30px;height:30px;margin-top:4px;border-radius:50%;background:var(--pn);border:1px solid var(--bd);display:grid;place-items:center;color:var(--dot)}
.av svg{width:16px;height:16px}
.bd{flex:1;min-width:0}
.th{transition:.4s;max-height:80px}.th.out{opacity:0;transform:scale(.9);max-height:0;overflow:hidden}
.typing{--d:1.2s;display:inline-flex;gap:9px;padding:15px 20px;background:linear-gradient(#fffaf4,#fdeedd);border:1px solid var(--bd);border-radius:22px 22px 22px 6px}
.typing i{width:9px;height:9px;border-radius:50%;background:var(--dot);animation:dt var(--d) ease-in-out infinite;animation-delay:calc(var(--d)/3*var(--n))}
.typing i:nth-child(1){--n:0}.typing i:nth-child(2){--n:1}.typing i:nth-child(3){--n:2}
@keyframes dt{0%,60%,100%{transform:translateY(0);opacity:.55}30%{transform:translateY(-7px);opacity:1}}
.rs{margin:4px 0 10px;border:1px solid var(--bd);border-radius:12px;padding:6px 12px;color:var(--mu);font-size:13px;background:#ffffff80}
.rs summary{cursor:pointer}.rs div{white-space:pre-wrap;max-height:200px;overflow:auto;margin-top:6px}
.ans{overflow-wrap:anywhere}.ans p{margin:.5em 0}.ans h2,.ans h3,.ans h4,.ans h5{margin:1em 0 .3em}
.ans code{background:#8c642018;padding:1px 6px;border-radius:6px;font:13px "JetBrains Mono",monospace}
.ans a{color:#9a6a1c}.ans blockquote{margin:.5em 0;padding-left:12px;border-left:2px solid var(--dot);color:var(--mu)}
.code{margin:.8em 0;border:1px solid var(--bd);border-radius:12px;overflow:hidden;background:#fffaf5}
.code>div{display:flex;justify-content:space-between;align-items:center;padding:4px 12px;background:#8c64201a;color:var(--mu);font-size:12px}
.code pre{margin:0;padding:12px;overflow:auto}.ans .code code{background:none;padding:0;font-size:13px;line-height:1.6}
.cur{display:inline-block;width:8px;height:8px;margin-left:4px;border-radius:50%;background:var(--dot);animation:bl 1s infinite}
@keyframes bl{50%{opacity:.2}}
.ft{display:flex;align-items:center;gap:10px;color:var(--mu);font-size:12px;margin-top:4px}.ft button{color:var(--mu)}.ft button:hover{color:var(--tx)}
.ft svg,.code svg{width:15px;height:15px}
button:not(.done)>.c2,.done>.c1{display:none}.done{color:#3f8f5f!important}
.err{color:#b4412f;margin-top:6px}
footer{padding:0 18px 18px}
.box{max-width:760px;margin:auto;display:flex;align-items:flex-end;gap:8px;padding:10px 10px 10px 18px;border-radius:24px;background:var(--pn);border:1px solid var(--bd)}
.box:focus-within{border-color:var(--dot)}
#in{flex:1;resize:none;border:0;outline:0;background:none;max-height:200px;line-height:1.6;padding:6px 0}#in::placeholder{color:var(--mu)}
#send{flex:none;width:38px;height:38px;border-radius:50%;background:var(--tx);color:var(--bg);justify-content:center}
#send.stop .i-send,#send:not(.stop) .i-stop{display:none}
dialog{background:#fff6ee;color:var(--tx);border:1px solid var(--bd);border-radius:18px;padding:22px;width:min(440px,92vw);max-height:90dvh;overflow:auto}
dialog::backdrop{background:#3b2a2077}
.dh{display:flex;justify-content:space-between;align-items:center;font-size:18px;font-weight:700}
#x{color:var(--mu);padding:4px;border-radius:8px}#x:hover{background:#8c642018}
dialog label{display:block;margin:12px 0 4px;color:var(--mu);font-size:13px}
dialog input,dialog textarea{width:100%;background:#ffffffaa;border:1px solid var(--bd);border-radius:10px;padding:8px 10px;outline:0}
#ok{margin-top:16px;width:100%;justify-content:center;padding:10px;border-radius:12px;background:var(--tx);color:var(--bg);font-weight:700}
.art iframe{display:block;width:100%;height:420px;border:0;background:#fff}.art iframe[hidden]{display:none}
.art .tabs{display:inline-flex;gap:2px;background:#8c642014;border-radius:8px;padding:2px}
.art .tabs button{padding:2px 10px;border-radius:6px;font-size:12px}.art .tabs .on{background:var(--pn);color:var(--tx)}
.code .bt{display:inline-flex;gap:8px}.code>div button{color:var(--mu)}.code>div button:hover{color:var(--tx)}
#fs{padding:0;width:96vw;height:92dvh;max-width:none;max-height:none;border-radius:14px;overflow:hidden;position:relative}
#fs iframe{width:100%;height:100%;border:0;background:#fff;display:block}
#fx{position:absolute;top:8px;right:8px;width:34px;height:34px;justify-content:center;border-radius:50%;background:#3b2a20cc;color:#fff}
#mn{max-width:46vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#mp{padding:0;width:min(520px,94vw);max-height:80dvh;overflow:hidden}#mp[open]{display:flex;flex-direction:column}
.mph{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--bd);color:var(--mu)}
.mph input{flex:1;width:auto;border:0;outline:0;background:none;padding:4px;color:var(--tx)}
#ml{overflow:auto;padding:6px 8px 10px}.mg{padding:8px 10px 2px;color:var(--mu);font-size:12px;letter-spacing:.06em}
.mi{display:flex;width:100%;justify-content:space-between;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;text-align:left}
.mi:hover,.mi.on{background:#ffffffaa}.mi span{display:flex;flex-direction:column;min-width:0}.mi b{font-weight:500}
.mi small{color:var(--mu);font-size:11px;overflow:hidden;text-overflow:ellipsis}
.mi em{font-style:normal;font-size:11px;color:var(--mu);border:1px solid var(--bd);border-radius:999px;padding:0 8px;flex:none}
#gwl{max-height:150px;overflow:auto;border:1px solid var(--bd);border-radius:10px;padding:4px 8px;margin:6px 0}
#gwl label{display:flex;gap:8px;align-items:center;margin:2px 0;color:var(--tx);font-size:13px}#gwl input{width:auto}#gwl small{color:var(--mu);font-size:11px}
@media(max-width:760px){aside{position:fixed;inset:0 auto 0 0;transform:translateX(-100%)}aside.open{transform:none}#menu{display:inline-flex}#sx{display:inline-flex}#scrim{position:fixed;inset:0;background:#3b2a2055;z-index:4;display:none}aside.open+#scrim{display:block}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important}}
</style></head><body>

<div id="app">
<aside id="side"><div class="brand"><i data-lucide="moon"></i>Luna<button id="sx" aria-label="閉じる"><i data-lucide="x"></i></button></div><button id="new"><i data-lucide="plus"></i>新しいチャット</button><div id="list"></div><button id="cfg"><i data-lucide="settings"></i>設定</button></aside><div id="scrim"></div>
<main>
<header><button id="menu"><i data-lucide="menu"></i></button><button id="model"><i data-lucide="cpu"></i><span id="mn"></span><i data-lucide="chevron-down"></i></button></header>
<div id="scroll">
<div id="empty"><h1 id="gr"></h1><p>Workers AI のモデルとチャット</p>
<div class="chips"><button>今夜の空について教えて</button><button>短い詩を書いて</button><button>JavaScriptで時計を作って</button><button>アイデア出しを手伝って</button></div></div>
<div id="msgs"></div></div>
<footer><div class="box"><textarea id="in" rows="1" placeholder="Lunaに話しかける…"></textarea><button id="send"><i data-lucide="arrow-up" class="i-send"></i><i data-lucide="square" class="i-stop"></i></button></div></footer>
</main></div>
<dialog id="mp"><div class="mph"><i data-lucide="search"></i><input id="mq" placeholder="モデルを検索(名前・ID・提供元)" autocomplete="off"><button id="mpx" type="button" aria-label="閉じる"><i data-lucide="x"></i></button></div><div id="ml"></div></dialog>
<dialog id="fs"><button id="fx" aria-label="閉じる"><i data-lucide="x"></i></button><iframe sandbox="allow-scripts allow-forms allow-modals allow-popups"></iframe></dialog>
<dialog id="dlg"><div class="dh"><b>設定</b><button id="x" type="button" aria-label="閉じる"><i data-lucide="x"></i></button></div>
<label>システムプロンプト</label><textarea id="c_sys" rows="3" placeholder="例: あなたは親切なアシスタントです"></textarea>
<label>Temperature <span id="c_tv"></span></label><input id="c_t" type="range" min="0" max="1.5" step=".1">
<label>最大トークン数</label><input id="c_max" type="number" min="128" max="16384" step="128">
<label>モデルID直接指定(任意) 例: @cf/...</label><input id="c_mid">
<label style="display:flex;gap:8px;align-items:center;color:var(--tx)"><input type="checkbox" id="c_gw" style="width:auto">AI Gatewayのモデルを有効にする</label>
<div id="gwbox"><small id="gwnote" style="color:var(--mu)"></small><div id="gwl"></div><label>追加モデルID(1行に1つ 例: openai/gpt-4o)</label><textarea id="c_gwc" rows="2"></textarea></div>
<label>アクセスキー(Worker側でACCESS_KEYを設定した場合)</label><input id="c_key" type="password">
<label style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="c_art" style="width:auto">HTMLアーティファクト(AIがHTMLを作成しプレビュー表示)</label><button id="ok">保存</button></dialog>
<script src="https://cdn.jsdelivr.net/npm/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<script>
const $=s=>document.querySelector(s),E=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const L=(k,d)=>{try{return JSON.parse(localStorage[k])??d}catch{return d}},S=(k,v)=>{try{localStorage[k]=JSON.stringify(v)}catch{}};
let chats=L("luna.chats",[]),cfg={model:"@cf/meta/llama-3.3-70b-instruct-fp8-fast",system:"",temp:.7,max:4096,key:"",...L("luna.cfg",{})},cur=null,busy=false,ctl=null;

const CP='<i data-lucide="copy" class="c1"></i><i data-lucide="check" class="c2"></i>';
const ic=()=>window.lucide&&lucide.createIcons();
const ART="あなたは「Luna」です。基本はテキスト(Markdown)だけで答えてください。詩、文章、物語、説明、相談、翻訳、要約、コードの解説、一般的な質問には、HTMLを使わず文章で答えます。HTMLを出力するのは、ユーザーが「アプリ」「ツール」「ゲーム」「ウェブページ」「HTML」など、動くものや画面そのものを明確に求めたときだけです。その場合のみ、<!doctype html>で始まる完結した単一HTMLを、```html のコードブロック1つで出力してください(CSSとJSはインライン、外部通信なし。ライブラリが必要な場合のみ cdnjs.cloudflare.com から読み込む。localStorageは使えません)。迷ったらHTMLにせず、テキストで答えてください。";

/* ===== Markdown ===== */
const inl=t=>E(t).replace(/`([^`]+)`/g,"<code>$1</code>").replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>").replace(/\*([^*\s][^*]*)\*/g,"<i>$1</i>").replace(/\[([^\]]+)\]\((https?:[^\s)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
function blk(p){let h="",l=null,pa=[];const fl=()=>{if(pa.length)h+="<p>"+pa.join("<br>")+"</p>";pa=[]},cl=()=>{if(l){h+=`</${l}>`;l=null}};
 for(const x of p.split("\n")){let m;
  if(!x.trim()){fl();cl()}
  else if(m=x.match(/^(#{1,4})\s+(.*)/)){fl();cl();const n=m[1].length+1;h+=`<h${n}>${inl(m[2])}</h${n}>`}
  else if(m=x.match(/^\s*([-*+]|\d+[.)])\s+(.*)/)){fl();const t=/\d/.test(m[1])?"ol":"ul";if(l!=t){cl();h+=`<${t}>`;l=t}h+=`<li>${inl(m[2])}</li>`}
  else if(m=x.match(/^>\s?(.*)/)){fl();cl();h+=`<blockquote>${inl(m[1])}</blockquote>`}
  else if(/^-{3,}$/.test(x.trim())){fl();cl();h+="<hr>"}
  else{cl();pa.push(inl(x))}}
 fl();cl();return h}
const md=(s,nop)=>s.split("```").map((p,i)=>{if(!(i%2))return blk(p);const n=p.indexOf("\n"),lang=n<0?p:p.slice(0,n).trim(),code=n<0?"":p.slice(n+1).replace(/\n$/,"");
 if(!nop&&/^html?$/i.test(lang)&&/<!doctype|<html|<body|<script/i.test(code)){const t=(code.match(/<title>([^<]*)/i)||[])[1]||"HTML";
  return `<div class="code art"><div><span>${E(t.trim())}</span><span class="tabs"><button class="on" data-tab="p">プレビュー</button><button data-tab="c">コード</button></span><span class="bt"><button data-full title="全画面"><i data-lucide="maximize-2"></i></button><button data-dl title="ダウンロード"><i data-lucide="download"></i></button><button data-cp title="コピー">${CP}</button></span></div><iframe sandbox="allow-scripts allow-forms allow-modals allow-popups" srcdoc="${E(code)}"></iframe><pre hidden><code>${E(code)}</code></pre></div>`}
 return `<div class="code"><div><span>${E(lang)}</span><button data-cp title="コピー">${CP}</button></div><pre><code>${E(code)}</code></pre></div>`}).join("");
const split=raw=>{const m=raw.match(/^\s*<think>([\s\S]*?)(<\/think>|$)/);return m?{t:m[1].trim(),a:raw.slice(m[0].length).trim()}:{t:"",a:raw}};

/* ===== 描画 ===== */
function draw(e,m,live){
 const th=e.querySelector(".th"),rs=e.querySelector(".rs"),an=e.querySelector(".ans"),ft=e.querySelector(".ft");
 if(th&&(m.content||!live)&&!th.classList.contains("out")){th.classList.add("out");setTimeout(()=>th.remove(),500)}
 if(m.think){rs.hidden=false;rs.querySelector("div").textContent=m.think;if(live&&!m.content)rs.open=true;else if(live&&!rs.dataset.c){rs.open=false;rs.dataset.c=1}}
 an.innerHTML=md(m.content,live||cfg.art===false)+(live&&m.content?'<i class="cur"></i>':"")+(m.err?`<div class="err">⚠ ${E(m.err)}</div>`:"");
 ft.innerHTML=live?"":`${E((m.model||"").split("/").pop())}${m.ms?" · "+(m.ms/1000).toFixed(1)+"秒":""}<button data-cm title="コピー">${CP}</button>${e._last?'<button data-re title="再生成"><i data-lucide="refresh-cw"></i></button>':""}`;ic()}
function msgEl(m,live,last){const e=document.createElement("div");e.className="m "+m.role;
 if(m.role=="user"){e.innerHTML=`<div class="u">${E(m.content).replace(/\n/g,"<br>")}</div>`;return e}
 e.innerHTML=`<div class="av"><i data-lucide="moon"></i></div><div class="bd">${live?'<div class="th"><div class="typing"><i></i><i></i><i></i></div></div>':""}<details class="rs" hidden><summary>思考のしずく</summary><div></div></details><div class="ans"></div><div class="ft"></div></div>`;
 e._m=m;e._last=last;draw(e,m,live);return e}
function paint(){const box=$("#msgs"),ms=cur?.msgs||[];box.innerHTML="";ms.forEach((m,i)=>box.append(msgEl(m,busy&&i==ms.length-1&&m.role=="assistant",i==ms.length-1)));$("#scroll").scrollTop=1e9}
function ui(){$("#list").innerHTML=chats.map(c=>`<div class="ci${c==cur?" on":""}" data-id="${c.id}"><span>${E(c.title)}</span><button data-del title="削除"><i data-lucide="trash-2"></i></button></div>`).join("");
 const s=$("#send");s.classList.toggle("stop",busy);$("#empty").hidden=!!cur?.msgs.length;ic()}
const save=()=>S("luna.chats",chats.slice(0,60));

/* ===== 送信・ストリーミング ===== */
async function send(txt){if(busy||!txt.trim())return;
 if(!cur){cur={id:Date.now(),title:txt.trim().slice(0,30),msgs:[]};chats.unshift(cur)}
 cur.msgs.push({role:"user",content:txt.trim()});await gen()}
async function gen(){
 const m={role:"assistant",content:"",model:cfg.model};cur.msgs.push(m);busy=true;document.body.classList.add("think");ui();paint();
 const el=$("#msgs").lastElementChild,t0=performance.now();ctl=new AbortController();let raw="",rs="",q=0;
 const up=()=>{const s=split(raw);m.content=s.a;m.think=rs||s.t;draw(el,m,true);const sc=$("#scroll");if(sc.scrollHeight-sc.scrollTop-sc.clientHeight<200)sc.scrollTop=1e9};
 try{
  const r=await fetch("/api/chat",{method:"POST",signal:ctl.signal,headers:{"content-type":"application/json","x-luna-key":cfg.key},
   body:JSON.stringify({model:cfg.model,system:[cfg.art===false?"":ART,cfg.system].filter(Boolean).join("\n\n"),temperature:cfg.temp,max_tokens:cfg.max,messages:cur.msgs.slice(0,-1).filter(x=>x.content).map(({role,content})=>({role,content}))})});
  if(!r.ok){const e=await r.json().catch(()=>({}));if(r.status==401)openCfg();throw Error(e.error||"エラー "+r.status)}
  const rd=r.body.getReader(),dc=new TextDecoder();let buf="";
  for(;;){const{done,value}=await rd.read();if(done)break;buf+=dc.decode(value,{stream:true});const ls=buf.split("\n");buf=ls.pop();
   for(const l of ls){if(!l.startsWith("data:"))continue;const d=l.slice(5).trim();if(d=="[DONE]")continue;let j;try{j=JSON.parse(d)}catch{continue}
    const c=j.choices?.[0]?.delta;
    if(typeof j.response=="string")raw+=j.response;
    else if(c){raw+=c.content||"";rs+=c.reasoning_content||c.reasoning||""}
    else if(j.type=="response.output_text.delta")raw+=j.delta;
    else if(j.type=="response.reasoning_text.delta")rs+=j.delta;
    q=q||requestAnimationFrame(()=>{q=0;up()})}}
 }catch(e){if(e.name!="AbortError")m.err=e.message}
 cancelAnimationFrame(q);m.ms=performance.now()-t0;up();busy=false;ctl=null;document.body.classList.remove("think");save();ui();paint()}
const go=()=>{if(busy)return ctl?.abort();const t=$("#in").value;$("#in").value="";$("#in").style.height="";send(t)};

/* ===== イベント ===== */
$("#send").onclick=go;
$("#in").onkeydown=e=>{if(e.key=="Enter"&&!e.shiftKey&&!e.isComposing&&e.keyCode!=229){e.preventDefault();go()}};
$("#in").oninput=e=>{const t=e.target;t.style.height="auto";t.style.height=t.scrollHeight+"px"};
$("#new").onclick=()=>{if(busy)return;cur=null;paint();ui();$("#side").classList.remove("open")};
$("#menu").onclick=()=>$("#side").classList.toggle("open");$("#sx").onclick=$("#scrim").onclick=()=>$("#side").classList.remove("open");addEventListener("keydown",e=>{if(e.key=="Escape")$("#side").classList.remove("open")});
$("#list").onclick=e=>{if(busy)return;const ci=e.target.closest(".ci");if(!ci)return;const c=chats.find(c=>c.id==ci.dataset.id);
 if(e.target.closest("[data-del]")){chats=chats.filter(x=>x!=c);if(cur==c)cur=null;save()}else cur=c;paint();ui();$("#side").classList.remove("open")};
$("#msgs").onclick=e=>{const b=e.target.closest("button");if(!b)return;const m=b.closest(".m");
 if(b.dataset.cp!==undefined||b.dataset.cm!==undefined){navigator.clipboard.writeText(b.dataset.cp!==undefined?b.closest(".code").querySelector("code").textContent:m._m.content);b.classList.add("done");setTimeout(()=>b.classList.remove("done"),1200)}
 else if(b.dataset.re!==undefined&&!busy){cur.msgs.pop();gen()}
 else if(b.dataset.tab){const c=b.closest(".code"),pv=b.dataset.tab=="p";c.querySelector("iframe").hidden=!pv;c.querySelector("pre").hidden=pv;c.querySelectorAll("[data-tab]").forEach(x=>x.classList.toggle("on",x==b))}
 else if(b.dataset.full!==undefined){$("#fs iframe").srcdoc=b.closest(".code").querySelector("code").textContent;$("#fs").showModal()}
 else if(b.dataset.dl!==undefined){const c=b.closest(".code"),a=document.createElement("a");a.href=URL.createObjectURL(new Blob([c.querySelector("code").textContent],{type:"text/html"}));a.download=(c.querySelector("span").textContent||"luna").replace(/[^\w\u3040-\u9fff-]+/g,"_")+".html";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1e3)}};
$("#fx").onclick=()=>$("#fs").close();$("#fs").onclose=()=>$("#fs iframe").srcdoc="";
document.querySelectorAll(".chips button").forEach(b=>b.onclick=()=>send(b.textContent));

const CAT={cf:[],gw:[],gwOk:false};
const gwList=()=>cfg.gw?[...CAT.gw.filter(m=>(cfg.gwOn||[]).includes(m.id)),...(cfg.gwCustom||"").split("\n").map(x=>x.trim()).filter(x=>/^[\w.-]+\/[\w.:@\/-]+$/.test(x)).map(id=>({id,name:id,tag:"カスタム"}))]:[];
const allModels=()=>[...CAT.cf.map(m=>({...m,g:"Workers AI"})),...gwList().map(m=>({...m,g:"AI Gateway"}))];
const setModelLabel=()=>{$("#mn").textContent=(allModels().find(m=>m.id==cfg.model)||{name:cfg.model}).name};
function renderModels(q0=""){const q=q0.toLowerCase().trim(),ms=allModels().filter(m=>!q||(m.name+" "+m.id+" "+m.tag+" "+m.g).toLowerCase().includes(q));let h="",g="";
 for(const m of ms){if(m.g!=g){g=m.g;h+=`<div class="mg">${m.g}</div>`}h+=`<button class="mi${m.id==cfg.model?" on":""}" data-id="${E(m.id)}"><span><b>${E(m.name)}</b><small>${E(m.id)}</small></span><em>${E(m.tag)}</em></button>`}
 if(!ms.length&&/^(@cf\/)?[\w.-]+\/[\w.:@\/-]+$/.test(q0.trim()))h=`<button class="mi" data-id="${E(q0.trim())}"><span><b>このIDを使う</b><small>${E(q0.trim())}</small></span></button>`;
 $("#ml").innerHTML=h||'<div class="mg">該当するモデルがありません</div>'}
$("#model").onclick=()=>{$("#mq").value="";renderModels();$("#mp").showModal();$("#mq").focus()};
$("#mq").oninput=e=>renderModels(e.target.value);
$("#mq").onkeydown=e=>{if(e.key=="Enter"&&!e.isComposing){const f=$("#ml .mi");if(f)f.click()}};
$("#ml").onclick=e=>{const b=e.target.closest(".mi");if(!b)return;cfg.model=b.dataset.id;S("luna.cfg",cfg);setModelLabel();$("#mp").close()};
$("#mpx").onclick=()=>$("#mp").close();
$("#mp").onclick=e=>{const r=e.currentTarget.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)e.currentTarget.close()};
function openCfg(){$("#side").classList.remove("open");$("#c_art").checked=cfg.art!==false;$("#c_sys").value=cfg.system;$("#c_t").value=cfg.temp;$("#c_tv").textContent=cfg.temp;$("#c_max").value=cfg.max;$("#c_key").value=cfg.key;$("#c_mid").value="";$("#c_gw").checked=!!cfg.gw;$("#c_gw").disabled=!CAT.gwOk;$("#c_gwc").value=cfg.gwCustom||"";
 $("#gwnote").textContent=CAT.gwOk?"有効にすると、モデル選択にAI Gatewayのモデルが加わります。":"WorkerにCF_ACCOUNT_IDとGATEWAY_IDが未設定のため、まだ使えません(README参照)。";
 $("#gwl").innerHTML=CAT.gw.map(m=>`<label><input type="checkbox" value="${E(m.id)}"${(cfg.gwOn||[]).includes(m.id)?" checked":""}>${E(m.name)}<small>${E(m.id)}</small></label>`).join("");$("#dlg").showModal()}
$("#cfg").onclick=openCfg;$("#c_t").oninput=e=>$("#c_tv").textContent=e.target.value;
$("#x").onclick=()=>$("#dlg").close();
$("#dlg").onclick=e=>{const r=e.currentTarget.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)e.currentTarget.close()};
$("#ok").onclick=()=>{try{cfg.art=$("#c_art").checked;cfg.system=$("#c_sys").value;cfg.temp=+$("#c_t").value;cfg.max=+$("#c_max").value||2048;cfg.key=$("#c_key").value;
 cfg.gw=$("#c_gw").checked;cfg.gwOn=[...document.querySelectorAll("#gwl input:checked")].map(x=>x.value);cfg.gwCustom=$("#c_gwc").value;
 if(!cfg.gw&&!cfg.model.startsWith("@cf/"))cfg.model=CAT.cf[0]?.id||cfg.model;
 const mid=$("#c_mid").value.trim();if(mid)cfg.model=mid;
 S("luna.cfg",cfg);setModelLabel()}finally{$("#dlg").close()}};

/* ===== 起動 ===== */
const h=new Date().getHours();$("#gr").textContent=(h<5?"こんばんは":h<11?"おはようございます":h<18?"こんにちは":"こんばんは")+"。ご用件をお聞かせください。";

fetch("/api/models").then(r=>r.json()).then(d=>{CAT.cf=d.models;CAT.gw=d.gateway?.models||[];CAT.gwOk=!!d.gateway?.available}).catch(()=>{}).finally(setModelLabel);
ui();paint();ic();
</script></body></html>
